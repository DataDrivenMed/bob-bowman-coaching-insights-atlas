<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Independent notes on Bob Bowman's public coaching threads, organized by the problems swim coaches, swimmers and parents bring to the pool. Not affiliated with or endorsed by Bob Bowman.">
<meta name="theme-color" content="#0B3A53">
<title>Notes on Bob Bowman's coaching</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preload" href="./fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./styles.css?v=20261105-redesign">
</head>
<body>
<div id="atlas"><p class="loading">Loading the notes&hellip;</p></div>
<noscript><p class="loading">These notes need JavaScript. You can still read or download <a href="./threads.json">the original thread data</a> and <a href="./weekly-updates.json">the weekly additions</a>.</p></noscript>
<script type="module">
import { mountAtlas } from './app.js?v=20261105-redesign';
const root = document.getElementById('atlas');
const readJSON = async path => { const r = await fetch(path, {cache: 'no-cache'}); if (!r.ok) throw Error('Could not load ' + path); return r.json(); };
const unique = (items, key) => [...new Map(items.map(x => [x[key], x])).values()];
// The weekly agent writes weekly-updates.json in the same schema as before. Nothing here changes that contract.
Promise.all([
  readJSON('./threads.json'),
  readJSON('./weekly-updates.json').then(w => { if (w.schemaVersion !== 1 || !Array.isArray(w.threads) || !Array.isArray(w.archiveLedger)) throw Error('Invalid weekly data'); return w; }).catch(() => null),
  readJSON('./guide.json').catch(() => null)
]).then(([data, weekly, guide]) => {
  data.archiveThreadIds = data.threads.map(t => t.id);
  if (weekly) {
    data.threads = unique([...data.threads, ...weekly.threads], 'id');
    data.archiveLedger = unique([...data.archiveLedger, ...weekly.archiveLedger], 'id');
    data.updated = weekly.contentUpdated || data.updated;
    data.weeklyUpdate = weekly;
  }
  mountAtlas(root, data, guide, {weeklyFailed: !weekly});
}).catch(error => {
  root.replaceChildren();
  const h = document.createElement('h1'); h.textContent = 'The notes could not load';
  const p = document.createElement('p');
  p.textContent = 'threads.json must be valid JSON and sit beside index.html. Opening the file directly from your computer blocks data loading; use GitHub Pages or a local server. Details: ' + error.message;
  root.className = 'load-error'; root.append(h, p);
});
</script>
</body>
</html>
