<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An independent, curated notebook for exploring Bob Bowman's public coaching threads. Not affiliated with or endorsed by Bob Bowman.">
<title>Bob Bowman Coaching Insights Atlas</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
</head>
<body><a class="skip" href="#atlas-main">Skip to notebook</a><div id="atlas"><p class="loading">Loading the notebook...</p></div>
<noscript>This notebook needs JavaScript for its views. Read or download <a href="./threads.json">the thread data</a> directly.</noscript>
<script type="module">
import { mountAtlas } from './app.js?v=20261026-weekly';
const root = document.getElementById('atlas');
const readJSON = async path => { const r=await fetch(path,{cache:'no-cache'}); if(!r.ok) throw Error('Could not load '+path); return r.json(); };
const unique = (items,key) => [...new Map(items.map(x=>[x[key],x])).values()];
Promise.all([readJSON('./threads.json'),readJSON('./weekly-updates.json').then(w=>{if(w.schemaVersion!==1 || !Array.isArray(w.threads) || !Array.isArray(w.archiveLedger)) throw Error('Invalid weekly data');return w;}).catch(()=>null)])
.then(([data,weekly]) => {
  if (weekly) {
    if (weekly.schemaVersion!==1 || !Array.isArray(weekly.threads) || !Array.isArray(weekly.archiveLedger)) throw Error('Invalid weekly data');
    data.threads=unique([...data.threads,...weekly.threads],'id');
    data.archiveLedger=unique([...data.archiveLedger,...weekly.archiveLedger],'id');
    data.updated=weekly.contentUpdated || data.updated;
    data.weeklyUpdate=weekly;
    data.collectionNote="Combined collection: "+data.threads.filter(x=>!x.sample).length+" sourced summaries and "+data.archiveLedger.length+" recovered source records. Original archive through Oct24, plus weekly additions. A curated collection, not a complete X export.";
    const prior=data.coverage;
    data.coverage={...prior,title:'Archive and weekly update coverage',note:prior.note+' Weekly refreshes add readable-source-supported summaries, not a complete X feed.',facts:[...prior.facts.map(x=>'Original archive: '+x),'Current combined collection: '+data.threads.filter(x=>!x.sample).length+' sourced summaries; '+data.archiveLedger.length+' recovered source records.','Last checked: '+weekly.lastChecked+'. Content updated: '+weekly.contentUpdated+'.',weekly.checkNote],gaps:unique([...(prior.gaps||[]).map(note=>({note})),...(weekly.gaps||[]).map(note=>({note}))],'note').map(x=>x.note)};
  }
  mountAtlas(root,data);
  if (!weekly) {const p=document.createElement('p');p.className='status';p.textContent='Weekly update data is unavailable. Showing the preserved original archive; this is not a no-new-posts result.';root.prepend(p);}
}).catch(error => {
  root.replaceChildren(); const heading=document.createElement('h1'); heading.textContent='The notebook could not load';
  const p=document.createElement('p'); p.textContent='Check that threads.json is valid JSON and sits beside index.html. Opening this file directly may block data loading; use GitHub Pages or the local preview instructions in README.md. '+error.message;
  root.append(heading,p);
});
</script></body></html>
